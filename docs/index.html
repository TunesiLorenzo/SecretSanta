<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f2eb">
  <title>Secret Santa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="night-sky" aria-hidden="true">
    <span class="flake f1">✦</span><span class="flake f2">✧</span>
    <span class="flake f3">✦</span><span class="flake f4">✧</span>
    <span class="flake f5">✦</span><span class="flake f6">✧</span>
    <span class="flake f7">✦</span><span class="flake f8">✧</span>
  </div>
  <main class="card">
    <div class="card-top" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div>
    <div class="eyebrow">SECRET SANTA</div>
    <h1>Il tuo<br><em>Secret Santa</em></h1>
    <p class="intro">Controlla il tuo nome e apri il regalo.</p>
    <div class="divider" aria-hidden="true"><span>✦</span></div>
    <section class="message" aria-live="polite">
      <p id="loading" class="loading">Prepariamo la tua sorpresa…</p>
      <div id="ready" hidden>
        <p class="small-label">QUESTO INVITO È PER</p>
        <p id="giver" class="person"></p>
        <div class="gift-scene">
          <button id="reveal" class="gift-button" type="button" disabled aria-label="Apri il regalo">
            <span id="gift" class="gift gift-red" aria-hidden="true">
              <span class="gift-lid"><span class="bow bow-left"></span><span class="bow bow-right"></span></span>
              <span class="gift-box"></span>
            </span>
          </button>
          <div id="revealed" class="result" hidden>
            <p class="small-label">IL TUO REGALO È PER</p>
            <p id="recipient" class="person recipient"></p>
          </div>
        </div>
        <div class="bot-status" role="status">
          <span class="bot" aria-hidden="true"><span class="hat"></span><span class="bot-face"><i></i><i></i></span><span class="beard"></span></span>
          <span class="bot-copy"><strong>TUNEBOT</strong><span id="status-text">TuneBot sta randomizzando il Natale…</span></span>
          <span id="spinner" class="spinner" aria-hidden="true"></span>
        </div>
        <p id="instruction" class="instruction" hidden>Il tuo regalo è pronto. Clicca per aprirlo.</p>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>
    <div class="bottom-rule" aria-hidden="true"><span>✦</span></div>
    <p class="footer">SECRET SANTA</p>
  </main>
  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const decode = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
      const showError = message => {
        byId('loading').hidden = true;
        byId('ready').hidden = true;
        byId('error').textContent = message;
        byId('error').hidden = false;
      };
      async function prepare() {
        try {
          const params = new URLSearchParams(location.search);
          const draw = params.get('draw');
          const id = params.get('id');
          const key = location.hash.slice(1);
          if (!/^[a-f0-9]{32}$/.test(draw || '') || !/^[a-f0-9]{32}$/.test(id || '') || !/^[A-Za-z0-9_-]{43}$/.test(key)) throw Error('link');
          const response = await fetch('draws/' + draw + '.json', {cache: 'no-store'});
          if (!response.ok) throw Error('fetch');
          const record = (await response.json())[id];
          if (!record) throw Error('link');
          const cryptoKey = await crypto.subtle.importKey('raw', decode(key), 'AES-GCM', false, ['decrypt']);
          const plaintext = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(record.nonce)}, cryptoKey, decode(record.ciphertext));
          const assignment = JSON.parse(new TextDecoder().decode(plaintext));
          if (typeof assignment.giver !== 'string' || typeof assignment.recipient !== 'string') throw Error('link');
          byId('giver').textContent = assignment.giver;
          byId('loading').hidden = true;
          byId('ready').hidden = false;
          const variants = ['gift-red', 'gift-green', 'gift-blue', 'gift-gold'];
          const messages = ['TuneBot sta randomizzando il Natale…', 'TuneBot sta incartando la sorpresa…', 'TuneBot sta sistemando i nastri…', 'TuneBot sta preparando il regalo…'];
          const gift = byId('gift');
          const setGift = index => { gift.classList.remove(...variants); gift.classList.add(variants[index]); };
          let step = 0;
          const cycle = setInterval(() => {
            step++;
            setGift(step % variants.length);
            byId('status-text').textContent = messages[step % messages.length];
          }, 800);
          setTimeout(() => {
            clearInterval(cycle);
            setGift(Math.floor(Math.random() * variants.length));
            byId('spinner').hidden = true;
            byId('status-text').textContent = 'Tutto pronto!';
            byId('instruction').hidden = false;
            byId('reveal').disabled = false;
          }, 5000);
          byId('reveal').addEventListener('click', () => {
            byId('reveal').disabled = true;
            gift.classList.add('opened');
            byId('instruction').hidden = true;
            byId('status-text').textContent = 'Abbinamento svelato.';
            byId('recipient').textContent = assignment.recipient;
            setTimeout(() => { byId('revealed').hidden = false; }, 450);
          }, {once: true});
        } catch (_) {
          showError('Non riusciamo ad aprire questo invito. Controlla il link completo oppure chiedi aiuto a chi organizza.');
        }
      }
      prepare();
    })();
  </script>
</body>
</html>
